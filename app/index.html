<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Public Shopify client ID for App Bridge. The Worker (worker/index.ts) rewrites
      this tag with SHOPIFY_API_KEY when serving the page, so one build works for
      every environment and the key never has to be baked into the bundle.
    -->
    <meta name="shopify-api-key" content="" />
    <!-- App Bridge v4: must be the first script, loaded from Shopify's CDN, not async/deferred. -->
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <!-- Polaris web components (<s-page>, <s-button>, …), versioned and hosted by Shopify. -->
    <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ace Marks Git Connection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
