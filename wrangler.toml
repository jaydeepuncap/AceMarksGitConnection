# Cloudflare Workers configuration for Ace Marks Git Connection.
#
# Production is the default top-level environment (used by `wrangler deploy`
# and `npm run db:migrate:remote`).
# Development lives under [env.development] (used by `wrangler dev --env development`,
# `npm run deploy:development`, and `npm run db:migrate:development:remote`).
# An explicit [env.production] block is also provided for compatibility with `--env production`.

name = "ace-marks-git-connection"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

[assets]
# Output of `vite build` (see vite.config.ts → build.outDir).
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker sees every request first so it can add the Shopify
# frame-ancestors CSP header and inject the API key into index.html.
# It hands static files back to env.ASSETS.
run_worker_first = true

[observability]
enabled = true

# Daily cleanup of expired previews and old session records (worker/index.ts → scheduled).
[triggers]
crons = ["17 3 * * *"]

[vars]
APP_ENV = "production"
LOG_LEVEL = "info"
SHOPIFY_API_VERSION = "2026-07"
SHOPIFY_SCOPES = "read_themes,write_themes"
SHOPIFY_APP_URL = "https://ace-marks-git-connection.REPLACE_WITH_WORKERS_SUBDOMAIN.workers.dev"
GITHUB_API_BASE_URL = "https://api.github.com"
# Theme Sync (optional):
# MASTER_REPOSITORY – the master theme repository stores use when none is chosen in Settings.
# STORE_GROUP       – the stores of the collection (comma-separated *.myshopify.com domains).
#                     Staff of any listed store can see all of them and roll an update out to
#                     their Staging themes. Leave empty to keep every store separate.
# MASTER_REPOSITORY = "acemarks-collection/master-theme"
# MASTER_BRANCH = "main"
# STORE_GROUP = "acemarks.myshopify.com,paulevans.myshopify.com,jackerwin.myshopify.com,mylesapparel.myshopify.com,koio.myshopify.com"

[[d1_databases]]
binding = "DB"
database_name = "ace-marks-git-connection"
database_id = "0fa8cf96-ed3d-4505-9028-79064d9a422a"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "45ff456d0e2644b58e0aba0140c28da1"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "ace-marks-sync"

[[queues.consumers]]
queue = "ace-marks-sync"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 30
dead_letter_queue = "ace-marks-sync-dlq"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# ---------------------------------------------------------------------------
# Worker Previews (PR branches built by Workers Builds via `wrangler preview`)
# Bindings are NOT inherited from production. Previews deliberately get no
# D1, KV or Queue bindings so an unmerged branch can never read or write
# production data or tokens; they serve the built UI and /api/health only.
# To exercise the API in previews, create separate preview D1/KV resources
# and add [[previews.d1_databases]] / [[previews.kv_namespaces]] here.
# https://developers.cloudflare.com/workers/previews/configuration/
# ---------------------------------------------------------------------------
[previews.vars]
APP_ENV = "preview"
LOG_LEVEL = "debug"
SHOPIFY_API_VERSION = "2026-07"
SHOPIFY_SCOPES = "read_themes,write_themes"
# Empty: the request origin (the preview URL) is used.
SHOPIFY_APP_URL = ""
GITHUB_API_BASE_URL = "https://api.github.com"

# Separate rate-limit namespaces so preview traffic never counts against production.
[[previews.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "3001"
simple = { limit = 120, period = 60 }

[[previews.ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "3002"
simple = { limit = 10, period = 60 }

# ---------------------------------------------------------------------------
# Development Environment
# Used by: npm run dev:development
#          npm run deploy:development
#          npm run db:migrate:development:remote
# ---------------------------------------------------------------------------
[env.development]
name = "ace-marks-git-connection-dev"

[env.development.triggers]
crons = ["17 3 * * *"]

[env.development.vars]
APP_ENV = "development"
LOG_LEVEL = "debug"
SHOPIFY_API_VERSION = "2026-07"
SHOPIFY_SCOPES = "read_themes,write_themes"
SHOPIFY_APP_URL = ""
GITHUB_API_BASE_URL = "https://api.github.com"

[[env.development.d1_databases]]
binding = "DB"
database_name = "ace-marks-git-connection-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.development.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_DEV_KV_NAMESPACE_ID"

[[env.development.queues.producers]]
binding = "SYNC_QUEUE"
queue = "ace-marks-sync-dev"

[[env.development.queues.consumers]]
queue = "ace-marks-sync-dev"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
retry_delay = 30
dead_letter_queue = "ace-marks-sync-dlq-dev"

[[env.development.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[env.development.ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

