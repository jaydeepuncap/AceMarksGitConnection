# Template for one per-store Shopify app. Do not edit generated files by hand
# for shared settings: change this template, regenerate, and run
#   npm run apps:deploy
# so every store's app receives the same scopes, URLs and webhooks.
#
# Generated by: npm run apps:new -- <store-name> <client-id>

client_id = "{{CLIENT_ID}}"
name = "{{NAME}}"
handle = "{{HANDLE}}"
application_url = "{{APP_URL}}"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# read_themes: list themes / read theme files. write_themes: sync theme files
# (theme writes ALSO need Shopify's theme-modification exemption for this app).
scopes = "read_themes,write_themes"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "{{APP_URL}}/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false
